name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs BEFORE the JDK 21 setup on purpose: the runner image's
      # sdkmanager is built for the image's default Java 17 and fails
      # under JDK 21 (both earlier runs died inside sdkmanager steps).
      - name: Install SDK packages
        run: |
          set -x
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests + debug APK
        run: |
          set -o pipefail
          gradle --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log

      # Job logs need a GitHub sign-in to read, annotations don't.
      # On failure, surface the interesting tail of the build log as
      # annotations so the failure is diagnosable from the public run page.
      - name: Publish build log tail on failure
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("build.log")
          lines = p.read_text(errors="replace").splitlines() if p.exists() else ["(no build.log)"]
          keep = [l for l in lines if l.strip()]
          for l in keep[-50:]:
              msg = l.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:600]
              print(f"::error::{msg}")
          PYEOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
